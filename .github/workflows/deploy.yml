name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: true

jobs:
  # ── Notify start ──────────────────────────────────────────────
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "🚀 <b>[Web]</b> Deploy bắt đầu — <code>${{ github.ref_name }}</code> (${{ github.sha }}) commit message: ${{ github.event.head_commit.message }}"

  # ── Typecheck ─────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: notify-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Notify typecheck result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} <b>[Web]</b> Typecheck: ${{ job.status == 'success' && 'passed' || 'failed' }}"

  # ── Deploy ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [notify-start, typecheck]
    if: ${{ always() && needs.typecheck.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Deploy
        run: yarn deploy
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APP_VERSION: ${{ github.run_number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify deploy result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} <b>[Web]</b> Deploy: ${{ job.status == 'success' && 'passed' || 'failed' }} build version 'v' + ${{ github.run_number }}
            ${{ job.status == 'success' && ' → https://checkpoint-web.dev-hongquan.workers.dev' || '' }}
