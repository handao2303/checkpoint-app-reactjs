<!doctype html><html><head><meta charset="utf-8"><title>frame test</title>
<style>body{font-family:sans-serif;background:#eee;padding:16px}.row{display:flex;gap:24px;flex-wrap:wrap}
.cell{text-align:center}.disc{border-radius:50%;overflow:hidden;width:160px;height:160px;background:#cbd5e1}
img.baked{width:160px;height:160px;border-radius:50%}</style></head>
<body>
<div class="row" id="out"></div>
<script>
const FRAME_CX=110, FRAME_CY=104, FRAME_R=77, AVATAR_R=69, VB=220, SIZE=512;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function loadSvg(url){const t=await (await fetch(url)).text();const b=new Blob([t],{type:'image/svg+xml'});const u=URL.createObjectURL(b);const i=await loadImg(u);return i;}
async function composite(avatarSrc, frameUrl){
  const c=document.createElement('canvas');c.width=SIZE;c.height=SIZE;const ctx=c.getContext('2d');
  const [a,f]=await Promise.all([loadImg(avatarSrc),loadSvg(frameUrl)]);
  const scale=SIZE/2/FRAME_R, center=SIZE/2, discR=AVATAR_R*scale;
  ctx.save();ctx.beginPath();ctx.arc(center,center,discR,0,Math.PI*2);ctx.clip();
  const side=Math.max(a.width,a.height),sx=(a.width-side)/2,sy=(a.height-side)/2;
  ctx.drawImage(a,sx,sy,side,side,center-discR,center-discR,discR*2,discR*2);ctx.restore();
  const dW=VB*scale,dx=center-FRAME_CX*scale,dy=center-FRAME_CY*scale;ctx.drawImage(f,dx,dy,dW,dW);
  return c.toDataURL('image/png');
}
// sample avatar: a colored square via canvas
function sampleAvatar(){const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,400,400);g.addColorStop(0,'#f97316');g.addColorStop(1,'#7c3aed');x.fillStyle=g;x.fillRect(0,0,400,400);
  x.fillStyle='#fff';x.font='bold 120px sans-serif';x.textAlign='center';x.fillText('QL',200,240);return c.toDataURL();}
(async()=>{
  const av=sampleAvatar();
  const frames=['level-01','level-25','level-50','night-owl','country','traveler'];
  const out=document.getElementById('out');
  for(const fr of frames){
    const baked=await composite(av,'/frames/avatar-frame-'+fr+'.svg');
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML='<div style="position:relative;width:160px;height:160px">'+
      '<div class="disc"><img src="'+av+'" style="width:100%;height:100%;object-fit:cover"></div>'+
      '<img src="/frames/avatar-frame-'+fr+'.svg" style="position:absolute;width:143%;height:143%;left:-21.4%;top:-17.5%;pointer-events:none">'+
      '</div><div style="font-size:11px">overlay '+fr+'</div>'+
      '<img class="baked" src="'+baked+'"><div style="font-size:11px">baked '+fr+'</div>';
    out.appendChild(cell);
  }
})();
</script></body></html>
