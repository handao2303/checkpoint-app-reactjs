<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- Block browser auto-translation (Chrome/Edge/Safari) — the app ships its
         own vi/en i18n, so machine translation only garbles the UI. -->
    <meta name="google" content="notranslate" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />

    <!-- Fallback apple-touch-icon for dev mode. Build injects size-specific variants
         (see pwa-assets.config.ts). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- apple-touch-startup-image links are injected at build
         by @vite-pwa/assets-generator (see pwa-assets.config.ts). -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#F4511E" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110D" />

    <!-- PWA / Standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: status bar becomes a translucent overlay so the app
         fills the entire screen. Layouts use env(safe-area-inset-top) to
         push content below the status bar (see AppLayout / PublicShareLayout). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Checkpoint" />
    <!-- Prevent Safari from auto-linking phone numbers, dates, and addresses. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- Primary SEO -->
    <title>Checkpoint — Digital Travel Passport</title>
    <meta
      name="description"
      content="Collect real-world places, unlock city stamps, and share your travel journeys with Checkpoint."
    />
    <meta
      name="keywords"
      content="Checkpoint, travel passport, digital travel passport, travel app, check-in app, city stamps, travel journey, gamified travel"
    />
    <meta name="author" content="Checkpoint" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://checkpoint-app.space" />

    <!-- Open Graph -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Checkpoint — Digital Travel Passport" />
    <meta
      property="og:description"
      content="Collect real-world places, unlock city stamps, and share your travel journeys with Checkpoint."
    />
    <meta property="og:image" content="https://checkpoint-app.space/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://checkpoint-app.space/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://checkpoint-app.space" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Checkpoint" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Checkpoint — Digital Travel Passport" />
    <meta
      name="twitter:description"
      content="Collect real-world places, unlock city stamps, and share your travel journeys with Checkpoint."
    />
    <meta name="twitter:image" content="https://checkpoint-app.space/og-image.jpg" />

    <!-- App / Platform -->
    <meta name="application-name" content="Checkpoint" />
    <meta name="apple-mobile-web-app-title" content="Checkpoint" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
